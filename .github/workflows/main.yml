name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 1. Initialize npm project (if package.json doesn't exist)
    - name: Initialize npm project
      run: |
        if [ ! -f package.json ]; then
          npm init -y
        fi

    # 2. Install Capacitor dependencies locally (not globally)
    - name: Install Capacitor dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android

    # 3. Prepare the www directory and copy your HTML file
    - name: Prepare Web Assets
      run: |
        mkdir -p www
        cp index.html www/index.html

    # 4. Initialize Capacitor (creates capacitor.config.json)
    - name: Initialize Capacitor
      run: npx cap init "AI Study Assistant" "com.aistudyassistant.app" --web-dir=www

    # 5. Add the Android platform (uses the locally installed CLI)
    - name: Add Android Platform
      run: npx cap add android

    # 6. Sync web assets
    - name: Sync Web Assets to Android
      run: npx cap sync android

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build Debug APK
      working-directory: ./android
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AI-Study-Assistant-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
